[tool.poetry]
name = "hevy"
version = "0.1.0"
description = "CLI to manage Hevy workouts and routines via the Hevy public API"
authors = ["krytie <system-support@inspectablock.com>"]
readme = "README.md"

packages = [{ include = "hevy", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.2.3"
httpx = "^0.28.1"
typer = "^0.27.1"
rich = "^15.0.0"

[tool.poetry.scripts]
hevy = "hevy.cli:run"


[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
pytest = "^9.1.1"
mypy = "^2.3.1"
ruff = "^0.16.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Typer declares CLI metadata via calls in argument defaults; B008 is noise here.
per-file-ignores = { "src/hevy/commands/*.py" = ["B008"] }

[tool.black]
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
